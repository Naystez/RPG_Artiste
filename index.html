    "title": "Le premier casting se fait en chaussettes",
    "level": 2,
    "text": "Camille posta une annonce pour trouver quelqu’un à qui faire écouter sa chanson. Lio arriva en chaussettes, avec deux amis rencontrés dans l’escalier et un chien qu’aucun des trois ne connaissait.\nLe chien s’endormit au deuxième couplet. Au refrain, il leva la tête.\n« Coupe tout ce qui vient avant », dit Lio.\nCamille n’avait encore jamais accepté une note de mise en scène d’un animal. Le soir même, elle raccourcit la chanson et envoya la nouvelle version à Anissa."
  },
  {
    "id": "camille-03",
    "title": "Réunion de crise pour un bouton Envoyer",
    "level": 3,
    "text": "Anissa écouta la chanson en traversant un open space où une imprimante fumait. Elle débrancha l’imprimante, rassura son équipe et appela Camille.\n« Tu l’envoies au bar des Arcades. Ils font une scène ouverte jeudi. »\nCamille répondit qu’elle devait encore réfléchir à la virgule dans son mail.\n« D’accord. On se donne quinze secondes de réflexion stratégique. »\nAu bout de onze, Anissa entendit le clic. Elle demanda à Camille de lui rendre la pareille pour répondre à un « salut ». Elles y passèrent deux heures."
  },
  {
    "id": "camille-04",
    "title": "Le plan de Rachid comporte un rappel",
    "level": 4,
    "text": "Rachid débarqua avec un agenda et demanda à Camille son objectif à six mois.\n« Pouvoir dire que je chante sans rajouter “un peu”. »\nIl inscrivit « dire que je chante » à la date du jour. Camille protesta qu’il avait oublié le délai.\n« Non. Le délai, c’est pour apprendre à respirer entre les phrases. »\nLe bar des Arcades répondit pendant leur séance. Dix minutes sur scène. Rachid raya ses six premières cases et écrivit une seule ligne : « Jeudi, arriver. »"
  },
  {
    "id": "camille-05",
    "title": "Christelle découvre le télétravail vocal",
    "level": 5,
    "text": "Au salon de massage, Camille demanda à partir dix minutes plus tôt jeudi. Christelle répondit que toute absence mettait l’établissement en péril.\nPuis un client demanda à décaler d’une heure pour un rendez-vous chez le barbier. Christelle lui souhaita de trouver sa coupe.\nCamille proposa de prendre le premier créneau le lendemain, obtint son échange et descendit répéter dans la réserve. Elle découvrit qu’un carton de serviettes faisait un très bon pupitre. Elle y oublia sa feuille de paroles."
  },
  {
    "id": "camille-06",
    "title": "La scène ouverte ferme à vingt-deux heures",
    "level": 9,
    "text": "Sur la petite scène des Arcades, Camille chercha sa feuille dans sa poche. Elle en sortit un ticket de caisse et une liste de courses d’Inès. Elle annonça qu’elle allait interpréter « Tomates, lessive, ne pas oublier les tomates ».\nLe public rit. Camille retrouva le refrain sans le papier. Deux personnes le reprirent à la fin, dont une qui s’était trompée de bar.\nDe retour en coulisses, le régisseur lui proposa de revenir. Elle demanda combien de morceaux préparer. Il lui en demanda trois."
  },
  {
    "id": "camille-07",
    "title": "Un avis de trois mots",
    "level": 14,
    "text": "Lauriane avait filmé la prestation. Elle montra à Camille les vingt secondes où celle-ci scrutait ses chaussures.\n« Tu leur chantes quoi ? »\nCamille n’eut rien à répondre. Au deuxième visionnage, elle vit une femme au premier rang se pencher en avant pour essayer d’attraper son regard.\nAlexis suggéra une solution douce : poser la caméra à hauteur des yeux et refaire une prise. Camille la regarda pendant une chanson entière. La prise était raide et fausse par endroits, mais pour la première fois, on aurait dit qu’elle parlait à quelqu’un."
  },
  {
    "id": "camille-08",
    "title": "La bande LUX fait un geste",
    "level": 18,
    "text": "LUX, l’ancien groupe de Camille, vit la vidéo des Arcades. Le groupe lui proposa de revenir pour une soirée, « en qualité d’ancienne collaboratrice ». Elle lut le détail : apporter son propre micro, apparaître derrière le batteur et chanter les harmonies.\nElle déclina et demanda la vieille maquette qu’ils avaient enregistrée ensemble. Le batteur l’envoya, ravi qu’on lui parle enfin d’autre chose que du volume de sa caisse claire. Camille retrouva dessus un couplet qu’elle avait écrit et oublié. Elle en fit sa deuxième chanson."
  },
  {
    "id": "camille-09",
    "title": "Le colis en recommandé",
    "level": 22,
    "text": "Voldemort découvrit la vidéo. Il écrivit : « Fier de ce que tu deviens. Passe à la maison, on parlera de ce que je peux faire pour toi. » Puis, comme Camille ne répondait pas : « Tu as pris mon câble. »\nCamille faillit ressortir du métro pour aller le lui rendre. Anissa lui fit relire les deux messages dans l’ordre. Camille expédia le câble et demanda que les questions sur ses affaires passent par écrit. Elle garda une copie du reçu dans le carton du micro."
  },
  {
    "id": "camille-10",
    "title": "Les loges sentent la lessive",
    "level": 27,
    "text": "Pour la deuxième soirée aux Arcades, Inès transforma la buanderie en loge avec un miroir posé sur un panier à linge. Mélissa accrocha au mur un plan de maquillage « compatible avec deux yeux ouverts », une clause à laquelle elle tenait personnellement.\nLa nouvelle chanson passa bien. La troisième, trop longue, laissa au public le temps de commander deux tournées. Une femme attendit pourtant la fin pour dire à Camille que son histoire de clé lui rappelait la sienne. Camille nota la phrase de la femme, après lui avoir demandé la permission."
  },
  {
    "id": "camille-11",
    "title": "Deux invités, un tabouret",
    "level": 31,
    "text": "Nathan décrocha un duo au Café du Pont en discutant avec un homme qui n’était pas le patron. L’homme était le pianiste et le patron n’était au courant de rien. Ils s’arrangèrent autour d’un tabouret.\nCamille avait prévu de chanter toutes ses chansons au même tempo. Le pianiste en ralentit une sans la prévenir. Il lui laissa assez de silence pour qu’elle entende une phrase qu’elle avait jusque-là avalée. À la fin, elle lui demanda s’il voulait refaire ça en étant officiellement attendu."
  },
  {
    "id": "camille-12",
    "title": "Le père Noël du mois de mai",
    "level": 35,
    "text": "Nathan lui trouva aussi une audition pour une publicité. Camille devait dire « Je le veux rouge » avec l’intensité d’une femme qui vient d’apprendre un secret. Elle s’imagina que le père Noël lui devait de l’argent.\nL’équipe éclata de rire. Le directeur de casting lui demanda de rejouer la scène presque sans bouger. Cette fois, il sourit et garda son numéro. La publicité prit quelqu’un d’autre. Trois jours plus tard, il rappela pour une lecture de théâtre."
  },
  {
    "id": "camille-13",
    "title": "L’actrice qui attend son tour",
    "level": 40,
    "text": "À la lecture, Camille jouait une voisine. Elle avait deux répliques et passa les quatre-vingts premières minutes à les répéter dans sa tête. Quand son tour arriva, elle dit la première au milieu de la tirade d’un autre.\nLa metteuse en scène lui demanda de lire ce qui précédait, puis de répondre comme si elle découvrait la situation. Camille entendit la voix de son partenaire trembler. Sa réplique sortit tout autrement. Elle obtint le rôle et repartit avec une consigne : écouter jusqu’au bout."
  },
  {
    "id": "camille-14",
    "title": "Un frigo en résidence artistique",
    "level": 44,
    "text": "En répétition, Camille apporta le bruit de son frigo comme exemple de ce qui épuise sa voisine. Le régisseur demanda un enregistrement. Inès s’en chargea, puis oublia d’arrêter le téléphone avant de lui dire : « Tu peux faire moins de bruit ? C’est pour une œuvre. »\nLa metteuse en scène garda la prise, y compris la négociation avec le frigo. Elle demanda à Camille d’écrire une chanson courte pour le changement de décor. Camille comprit qu’une cuisine pouvait lui servir de studio, à condition d’attendre la fin du cycle de dégivrage."
  },
  {
    "id": "camille-15",
    "title": "Une critique à deux étoiles",
    "level": 48,
    "text": "Le spectacle ouvrit devant seize personnes. Un blog lui donna deux étoiles. La mère de Camille annonça la nouvelle avec enthousiasme avant de comprendre que le barème en comptait cinq.\nCamille lut que la chanson de transition semblait arriver « d’un autre spectacle ». Elle retourna s’asseoir avec la metteuse en scène pour écouter la réplique qui la précédait. Elles coupèrent un couplet et changèrent son entrée. Le lendemain, Camille entendit quelqu’un fredonner l’air en quittant la salle."
  },
  {
    "id": "camille-16",
    "title": "Le comité des poubelles",
    "level": 53,
    "text": "Camille proposa de jouer ses nouvelles chansons dans la cour de l’immeuble. Inès s’engagea à vider les poubelles avant le concert. Elle tint parole à sa façon : elles disparurent derrière un rideau.\nAu moment le plus émouvant, le camion de collecte passa et le gardien surgit sur scène pour récupérer les bacs. Camille décala son deuxième couplet et attendit son retour. Il s’assit au premier rang, en gants orange. Elle décida de garder la pause dans la chanson. Elle ferait moins de bruit à l’enregistrement."
  },
  {
    "id": "camille-17",
    "title": "La maquette à l’heure creuse",
    "level": 57,
    "text": "Mélissa obtint un studio à tarif réduit entre six et huit heures du matin. À six heures, personne n’avait de voix. À sept heures, Camille en avait assez pour enregistrer la chanson de la clé. À sept heures cinquante-huit, elle essaya une version avec le silence de la cour.\nLe pianiste préféra celle-là. Il lui demanda aussi de mettre son nom sur la maquette : les harmonies et l’arrangement venaient de leurs répétitions communes. Camille ajouta les crédits avant de faire écouter quoi que ce soit."
  },
  {
    "id": "camille-18",
    "title": "Une chanson en pièce jointe",
    "level": 61,
    "text": "Voldemort renvoya un dossier qu’il disait avoir préparé « pour sa carrière ». Sur la couverture, son propre nom occupait plus de place que celui de Camille. Il voulait présenter ses chansons à des producteurs en se faisant passer pour son représentant.\nElle refusa et écrivit aux deux personnes qu’il avait mises en copie. L’une d’elles, une programmatrice, demanda quand même à écouter la maquette, envoyée directement par Camille. Il y avait une date libre à la fin du mois. Le dossier de Voldemort partit dans un sous-dossier nommé « À conserver »."
  },
  {
    "id": "camille-19",
    "title": "Le premier cachet",
    "level": 66,
    "text": "La date payée rapporta à Camille assez pour régler le studio et dîner après le concert. À la table, Rachid sortit un tableur pour répartir l’argent.\n« Le dessert est dans quelle colonne ? » demanda Inès.\nIl en créa une. Camille paya le pianiste avant de commander, glissa la facture dans une enveloppe et garda une pièce pour le vestiaire. En récupérant son manteau, elle trouva dans la poche un flyer de l’époque de LUX. Elle écrivit le montant de son premier cachet au dos."
  },
  {
    "id": "camille-20",
    "title": "Une saison au théâtre",
    "level": 70,
    "text": "La metteuse en scène proposa à Camille un rôle plus long pour sa prochaine pièce. Elle y jouait une chanteuse obligée de doubler la voix d’une vedette derrière un paravent.\nCamille trouva la situation peu crédible. Puis elle se rappela l’invitation de LUX à chanter derrière le batteur et demanda quand commençaient les répétitions.\nLe premier jour, elle chanta si fort qu’on ne comprit plus la réplique de la vedette. Les deux actrices essayèrent ensemble jusqu’à ce que le public puisse entendre l’effort de l’une pour voler la place de l’autre."
  },
  {
    "id": "camille-21",
    "title": "Une salle de trente mètres carrés",
    "level": 74,
    "text": "Pour répéter sans faire trembler les tuyaux de la cave, Camille loua une salle à l’heure. Lio vint pour la première répétition, revint pour la deuxième et disparut à la troisième. Camille lui demanda ce qu’elle avait raté.\n« Rien. C’est justement le problème. Tu faisais la même chose trois fois. »\nCamille prit une feuille et y écrivit les passages qu’elle voulait essayer autrement. À la séance suivante, Lio revint et resta jusqu’au bout. Elle avait apporté du pain, ce qui inquiétait davantage l’équipe que son absence."
  },
  {
    "id": "camille-22",
    "title": "Le contrat et le stabilo",
    "level": 79,
    "text": "Une petite société de production proposa de financer un EP de trois titres. Le contrat offrait une somme ronde et réclamait une liste de droits beaucoup plus longue. Rachid arriva avec un stabilo neuf. Au bout de deux pages, il demanda un deuxième stabilo.\nCamille fit relire l’accord, négocia la durée et conserva la possibilité de jouer ses chansons sur scène. La société accepta de financer deux titres au lieu de trois. Elle choisit elle-même lesquels et décida de payer le troisième avec ses prochains cachets."
  },
  {
    "id": "camille-23",
    "title": "Le podcast qu’on aurait pu couper",
    "level": 83,
    "text": "Une journaliste invita Camille à parler de sa double vie entre salon et théâtre. Camille expliqua la réserve, la feuille de paroles oubliée et le ticket de caisse. Elle ajouta que Christelle avait du flair, surtout pour entendre une demande de congé à travers trois cloisons.\nL’extrait circula. Christelle le fit écouter à la réception pour prouver que Camille « avait toujours eu du potentiel ». Camille profita du moment pour demander un vrai jour fixe pour les répétitions. Christelle accepta devant deux clientes qui venaient de s’abonner au podcast."
  },
  {
    "id": "camille-24",
    "title": "Le public est en avance sur le refrain",
    "level": 87,
    "text": "Une vidéo des Arcades dépassa tout ce que Camille avait posté. À son concert suivant, le public reprit la phrase de la clé avant elle. Camille eut le réflexe de chanter par-dessus, puis regarda le pianiste et attendit. Le public termina le refrain à sa place.\nAu bar, quelqu’un commanda « la chanson du double de clé ». Le barman servit deux cafés.\nCamille changea le titre sur la maquette. Elle tenait enfin le nom que les gens se rappelleraient sans avoir à ouvrir leur téléphone."
  },
  {
    "id": "camille-25",
    "title": "La tournée des trois ronds-points",
    "level": 92,
    "text": "Nathan trouva quatre dates dans trois villes. La voiture d’Alexis affichait un voyant que Lauriane appelait « l’étoile de la prudence ». Ils partirent quand même avec un budget essence, de quoi payer les techniciens et un sac de vêtements qui arriva une ville avant eux.\nAu premier concert, Camille joua avec les manches de la chemise d’Alexis retroussées jusqu’aux coudes. Elle la remit le lendemain alors que sa valise était revenue. Elle avait enfin trouvé une tenue dans laquelle elle oubliait de rentrer le ventre."
  },
  {
    "id": "camille-26",
    "title": "Une voix dans le public",
    "level": 96,
    "text": "Voldemort se présenta à une date et demanda à entrer en coulisses en se disant responsable de Camille. La personne à l’accueil vérifia la liste. Son nom n’y figurait pas.\nCamille apprit l’incident en arrivant. Elle en parla à la responsable de la salle, qui prévint l’équipe. Puis elle appela Anissa et lui demanda de rester au téléphone pendant qu’elle faisait ses vocalises.\nElle entra sur scène encore secouée. Au premier rang, une femme à qui elle avait serré la main la veille attendait le deuxième couplet."
  },
  {
    "id": "camille-27",
    "title": "La preuve par la clé USB",
    "level": 100,
    "text": "Lionel aida Camille à mettre de l’ordre dans les messages et les documents conservés. Il lui demanda ce qu’elle voulait récupérer, et elle dressa la liste de ses affaires et des enregistrements qui étaient restés chez Voldemort.\nLa récupération fut organisée avec un tiers. Parmi les cartons, Camille retrouva une vieille clé USB étiquetée « FINAL définitif V8 ». Elle contenait la première prise de sa chanson, qu’elle croyait perdue. Elle la copia, rangea la clé et passa le reste de l’après-midi à répéter avec son pianiste."
  },
  {
    "id": "camille-28",
    "title": "Camille joue quelqu’un de calme",
    "level": 105,
    "text": "La troupe présenta sa pièce dans un festival. Le jour de la représentation, le paravent ne tenait plus debout. Camille proposa de jouer sa chanteuse à découvert, face au public, pendant que les autres personnages feraient semblant de ne pas la voir.\nLa scène devint plus drôle et plus cruelle. Au salut, la metteuse en scène souffla qu’elle avait envie de garder ce dispositif.\n« Le paravent est disponible pour un entretien », répondit Camille. Ils le laissèrent plié contre le mur pour la représentation suivante."
  },
  {
    "id": "camille-29",
    "title": "Le clip sans pluie",
    "level": 109,
    "text": "Pour filmer son premier clip, Lio avait prévu un orage spectaculaire. Le ciel resta bleu. Inès proposa un tuyau d’arrosage et faillit tremper l’unique prise électrique.\nCamille coupa l’eau et déplaça l’équipe dans la cage d’escalier. Elle chanta en remontant les marches pendant que Lio descendait à reculons, très lentement, pour éviter d’ajouter une chute au scénario. En découvrant les images, elles gardèrent le début, où l’on entendait les tuyaux du sous-sol répondre avant la première note."
  },
  {
    "id": "camille-30",
    "title": "Neuf virgule quatre sur dix",
    "level": 113,
    "text": "Un concours de chanson sélectionna Camille. Avant le passage, on lui demanda de condenser son parcours en une phrase et demie. Elle répondit : « J’ai commencé dans une cave. Ensuite, il y avait des escaliers. »\nElle ne remporta pas le prix du jury. Le public lui donna pourtant la meilleure note de la soirée. En coulisses, une productrice de théâtre lui demanda de venir parler de ses chansons et de ses textes. Camille prit rendez-vous pour le matin, avant que le concours ne retire la table de café."
  },
  {
    "id": "camille-31",
    "title": "Une offre trop parfaite",
    "level": 118,
    "text": "La productrice lui proposa un spectacle à elle, à condition qu’elle apporte une idée claire. Le même jour, une agence lui offrit des mois de dates et une interview exclusive si elle racontait publiquement sa rupture dans les détails.\nCamille posa les deux offres sur la table. La seconde promettait de remplir l’agenda tout de suite. La première lui demandait d’arriver avec dix pages pour vendredi. Elle se servit du verso du dossier de l’agence pour écrire la première scène."
  },
  {
    "id": "camille-32",
    "title": "Le spectacle qui commence en bas",
    "level": 122,
    "text": "Camille écrivit un spectacle où une chanteuse répétait au sous-sol pendant qu’une assemblée de copropriétaires, à l’étage, cherchait l’origine du bruit. Ses chansons donnaient une autre version de chaque événement.\nLauriane lut le texte et souligna trois pages de débat sur les charges.\n« Est-ce que le public vient pour chanter ou pour voter le budget du syndic ? »\nCamille supprima deux pages. Elle garda le moment où une voisine se mettait à chanter à travers la bouche d’aération. Elle avait enfin trouvé comment faire se rencontrer les deux étages."
  },
  {
    "id": "camille-33",
    "title": "Les auditions du plafond",
    "level": 126,
    "text": "Camille ouvrit les auditions pour son spectacle. Son ancienne choriste de LUX se présenta sans prévenir. Camille s’attendait à des excuses. La choriste expliqua simplement qu’elle avait quitté le groupe à son tour et demanda si elle pouvait lire le rôle.\nCamille lui fit passer le même essai qu’aux autres. Elle fut la seule à entendre l’entrée du piano depuis derrière le décor et à donner la réplique au bon moment. Camille lui proposa le rôle et envoya les conditions par écrit le jour même."
  },
  {
    "id": "camille-34",
    "title": "La générale était presque générale",
    "level": 131,
    "text": "À la générale, la moitié des accessoires manquait et la mère de Camille s’était assise dans une chaise du décor. À la deuxième scène, une actrice dut lui demander de quitter la réunion de copropriété.\n« Je peux au moins voter ? »\nLa salle de répétition éclata de rire. Camille demanda ensuite à la comédienne de reprendre cette phrase dans le spectacle. Sa mère exigea un crédit au programme et proposa deux autres répliques. L’une concernait son nouveau compagnon. Camille ne retint que le vote."
  },
  {
    "id": "camille-35",
    "title": "On ajoute une chaise",
    "level": 135,
    "text": "À la première, le spectacle remplit soixante places. Le lendemain, une famille se présenta avec un billet de plus que la salle ne pouvait en accueillir. Camille vit le théâtre leur trouver une autre représentation et prendre leur numéro. La semaine précédente, elle avait appelé trois cousins pour compléter la salle.\nElle resta écouter les spectateurs dans le hall. Plusieurs parlaient de leurs voisins avant même de parler des chansons. Elle demanda à la productrice combien de dates ils pourraient ajouter avec la même équipe. Elles en trouvèrent deux."
  },
  {
    "id": "camille-36",
    "title": "Le rideau a pris une décision",
    "level": 139,
    "text": "En tournée, un rideau automatique descendit au milieu d’une chanson et s’arrêta à hauteur de genoux. Le public vit les chaussures de Camille et entendit la fin du couplet.\nCamille termina accroupie, tête sous le rideau. La choriste entra à son tour et elles chantèrent la dernière phrase assises au bord du plateau. Le lendemain, on proposa de reproduire l’accident pour les réseaux. Camille demanda plutôt à la régie de lui montrer comment vérifier les changements de décor avant l’ouverture des portes."
  },
  {
    "id": "camille-37",
    "title": "La vidéo avec la mauvaise légende",
    "level": 144,
    "text": "Un extrait du spectacle circula avec une légende attribuant la chanson à LUX. Le groupe avait gardé en ligne un bout de l’ancienne maquette. Camille reconnut le couplet enregistré chez eux.\nElle joignit les fichiers datés, contacta la chaîne qui avait publié l’extrait et fit corriger les crédits, y compris le nom de son pianiste. Le batteur de LUX partagea la version rectifiée. Il avait ajouté « baissez un peu le piano » sous la publication. Camille lui envoya un cœur et laissa le piano exactement où il était."
  },
  {
    "id": "camille-38",
    "title": "La loge avec une porte qui ferme",
    "level": 148,
    "text": "Camille récupéra les clés d’un appartement. Elle mit deux semaines à comprendre que la table de la cuisine pouvait rester une table de cuisine même quand elle ne servait pas de bureau, de pupitre ou de surface de repassage.\nInès et Mélissa vinrent dîner. Elles apportèrent le miroir de la buanderie et une petite plaque « LOGE 1 ». Camille accrocha la plaque à la porte de la chambre. Puis elles déplièrent une table de secours pour pouvoir manger autour du miroir, que personne n’avait pensé à retirer."
  },
  {
    "id": "camille-39",
    "title": "L’interview de quatre minutes",
    "level": 152,
    "text": "La promotion du spectacle envoya Camille sur un plateau télé. Le présentateur voulait savoir qui l’avait « découverte ». Elle cita le régisseur des Arcades, le pianiste, la metteuse en scène, Lio et le chien. La régie afficha le mot « publicité » avant la fin de la liste.\nOn lui laissa quand même chanter un refrain. Elle choisit celui que les gens connaissaient déjà. L’appel arriva le soir même : une grande salle voulait la recevoir sur une date d’essai. Elle aurait la soirée entière et devrait adapter le spectacle à un plateau trois fois plus large."
  },
  {
    "id": "camille-40",
    "title": "L’écho de sept cents places",
    "level": 157,
    "text": "Depuis le fond de la grande salle, Lauriane fit signe à Camille de recommencer la scène de la cave. Le premier geste, visible à soixante places, disparaissait à cette distance. Camille essaya plus grand. On aurait dit qu’elle guidait un avion.\nElles travaillèrent le placement et les éclairages jusqu’à ce que le fond de salle voie enfin la clé dans sa main. Camille demanda à la régie de ne pas éclairer tout le plateau pendant ce passage. Pour que la salle paraisse grande plus tard, il fallait d’abord retrouver la taille de la cave."
  },
  {
    "id": "camille-41",

function save(next, reward=false){
  const previousLevel=artistLevel();
  const level=levelOf(sum(Object.values(next.log)),stageCurve);
  const unlocked=chapters.filter(chapter=>chapter.level<=level&&!next.unlocked.includes(chapter.id));
  next.unlocked=[...next.unlocked,...unlocked.map(chapter=>chapter.id)];
  const rewards=[];
  if(reward && level>previousLevel){
    rewards.push({id:'level-'+level,title:'Niveau '+level+' atteint',text:'Camille monte d’un cran dans sa carrière. '+rank(level)+'.'});
    for(const [target,label] of source.heritage){
      if(Number(target)>previousLevel&&Number(target)<=level)
        rewards.push({id:'heritage-'+target,title:'Patrimoine · Niveau '+target,text:label});
    }
  }
  for(const chapter of unlocked.filter(chapter=>chapter.level>1)) rewards.push({id:'chapter-'+chapter.id,title:'Chapitre débloqué',text:chapter.title});
  const mail=next.mail??[];
  const fresh=rewards.filter(item=>!mail.some(message=>message.id===item.id));
  next.mail=[...fresh.map(item=>({...item,read:false,date:dateKey(new Date())})),...mail];
  try {localStorage.setItem(storeKey,JSON.stringify(next));}
  catch {flash('La sauvegarde locale a échoué.');return false;}
  state=next;
  if(fresh.length) flash('✉ '+(fresh.length===1?'Nouvelle récompense':'Nouvelles récompenses')+' dans la messagerie.');
  return true;
}

function toggleQuest(id,key){
  const q=quests().find(quest=>quest.id===id);
  const today=new Date();
  if(!q||key!==periodKey(q.period,today)){render();return;}
  const log={...state.log}, eventId=key+'|'+q.id;
  const undo=Boolean(log[eventId]);
  const before=artistLevel(), unlockCount=state.unlocked.length;
  if(undo) delete log[eventId];
  else{
    const earned=sum(summaryFor(q.period,today).filter(row=>row.domain===q.domain));
    if(earned+q.xp>cap[q.period]) return;
    log[eventId]={...q,key,date:dateKey(today)};
  }
  const mailCount=state.mail?.length??0;
  if(!save({...state,log},!undo)) return;
  render();
  main.querySelector('[data-quest="'+id+'"]')?.focus({preventScroll:true});
  if(!undo) animateQuest(id,q.xp,artistLevel()>before);
  if((state.mail?.length??0)===mailCount && state.unlocked.length===unlockCount){
    flash(undo?'Validation annulée.':'+'+q.xp+' XP'+(artistLevel()>before?' · Niveau '+artistLevel()+' atteint !':''));
  }
}

  cue.textContent=(levelUp?'✦ Niveau '+artistLevel()+' · ':'✦ ')+'+'+xp+' XP';

function openEditor(period){
  const originals=quests().filter(q=>q.period===period);
  editor.innerHTML='<form><h2 id="editorTitle">Personnaliser les quêtes '+(period==='daily'?'journalières':'hebdomadaires')+'</h2><p>Les validations passées restent dans l’historique. Le plafond par catégorie est de '+cap[period]+' XP sur la période.</p>'+
    '<fieldset><legend>Titres des catégories</legend>'+domains.map(domain=>'<label>'+domain.name+'<input name="title-'+domain.id+'" value="'+esc(domainTitle(domain))+'" maxlength="32" required></label>').join('')+'</fieldset>'+
    domains.map(domain=>'<fieldset><legend>'+esc(domainTitle(domain))+'</legend><div data-quest-rows="'+domain.id+'"></div><button type="button" data-add-row="'+domain.id+'">+ Ajouter une quête</button></fieldset>').join('')+
    '<p data-editor-error role="alert"></p><div class="actions"><button type="button" data-close>Annuler</button><button class="primary">Enregistrer</button></div></form>';
  const form=editor.querySelector('form');

    const list=form.querySelector('[data-quest-rows="'+q.domain+'"]');
    list.insertAdjacentHTML('beforeend','<div class="fields" data-config-row="'+q.id+'"><label>Intitulé<input data-name value="'+esc(q.name)+'" required maxlength="90"></label><label>XP<input data-xp type="number" value="'+q.xp+'" min="1" max="'+cap[period]+'" required></label><button type="button" data-remove-row aria-label="Supprimer cette quête">×</button></div>');
    return list.lastElementChild;
  }
  originals.forEach(appendRow);
  form.onclick=event=>{
    const button=event.target.closest('button');
    if(button?.dataset.addRow){
      const id='custom-'+(globalThis.crypto?.randomUUID?.()??(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)));
      appendRow({id,domain:button.dataset.addRow,name:'',xp:period==='daily'?50:125}).querySelector('[data-name]').focus();
    }
    if(button?.hasAttribute('data-remove-row')) button.closest('[data-config-row]').remove();
  };
  form.onsubmit=event=>{
    event.preventDefault();
    const fields=new FormData(form), custom={...state.custom};
    const updates=[...form.querySelectorAll('[data-config-row]')].map(row=>({
      id:row.dataset.configRow,domain:row.closest('[data-quest-rows]').dataset.questRows,period,
      name:row.querySelector('[data-name]').value.trim(),xp:Number(row.querySelector('[data-xp]').value)
    }));
    const issue=form.querySelector('[data-editor-error]');
    const titles=Object.fromEntries(domains.map(domain=>[domain.id,String(fields.get('title-'+domain.id)).trim()]));
    if(Object.values(titles).some(title=>!title)){issue.textContent='Chaque catégorie doit avoir un titre.';return;}
    if(updates.some(q=>!q.name)){issue.textContent='Chaque quête doit avoir un intitulé.';return;}
    const kept=new Set(updates.map(q=>q.id));
    originals.filter(q=>!kept.has(q.id)).forEach(q=>custom[q.id]={...q,archived:true});
    updates.forEach(q=>custom[q.id]=q);
    if(save({...state,custom,titles})){editor.close();render();flash('Quêtes mises à jour.');}
  };
  editor.showModal();
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button) return;
  const data=button.dataset;
  if(data.inbox!==undefined){renderInbox();inbox.showModal();return;}
  if(data.mailClose!==undefined){inbox.close();return;}

  if(data.read!==undefined){readMail(data.read);return;}

  if(data.go!==undefined){

  else if(data.progressTab!==undefined) progressTab=Number(data.progressTab);

  else if(data.day) historyDay=data.day;
  else if(data.chapter!==undefined) chapterId=data.chapter;
  else if(data.chapterBack!==undefined) chapterId=null;
  else return;

    const title=main.querySelector('.story-reading h2');

    else main.querySelector('[data-chapter]:not([disabled])')?.focus();

});

});

      const SPORT_STARTER = [

      const sportId = () =>

      let sportPage = "home",

      const sportChosenDate = () =>
        sportIsoValid(sportEntryDate) ? sportEntryDate : today();
      let sportMonth = new Date();
      sportMonth.setDate(1);
      const SPORT_LOCKED_ID = "hyrule-jambes-fessiers-v1";

      sport.programs.unshift(sportStarter());
      function sportCalendar() {

        let out =

        for (const day of ["L", "M", "M", "J", "V", "S", "D"])
          out += '<span class="sport-cal-label">' + day + "</span>";

        for (let d = 1; d <= days; d++) {

          if (correctedDate && sportIsoValid(correctedDate))

          if (note !== null) old.note = note;

        if (

        sport.active = JSON.parse(JSON.stringify(old));

          );

        return saved;
      }
      function sportNotify(t) {

      function sportExerciseKind(ex){
        if(ex.kind)return ex.kind;
        const key=sportNormalizeName(ex.name);
        const stored=sport.exerciseTypes?.[key.replace(/[^a-z0-9]/g,"")];if(stored)return stored;
        if(["velo appartement","velo elliptique","tapis de course","marche sur tapis","rameur","escalier cardio"].includes(key)){

          return "cardio";
        }
        if(/^(tractions|pompes|dips|crunch|releve|planche|ab wheel|dead bug|bird dog|russian twist|mountain climbers|pont fessier)/.test(key))return "bodyweight";
        return "strength";
      }
      function sportCardioType(ex){const key=sportNormalizeName(ex.name);return ({"velo appartement":"Vélo","velo elliptique":"Vélo elliptique","tapis de course":"Course à pied","marche sur tapis":"Marche","rameur":"Rameur","escalier cardio":"Escalier"})[key]||ex.name;}
      function sportSetText(ex,set){const kind=sportExerciseKind(ex);if(kind==="cardio")return `${set.minutes||0} min${set.distance?" · "+set.distance+" km":""}${set.resistance?" · résistance "+set.resistance:""}`;if(kind==="bodyweight")return `${set.reps||0} rép. · poids du corps${set.kg?" + "+set.kg+" kg de lest":""}`;return `${set.kg||0} kg × ${set.reps||0} rép.`;}
      function sportExerciseRows(ex,i){const kind=sportExerciseKind(ex);return ex.sets.map((set,j)=>{

      function sportLast(ex){for(const session of [...sport.sessions].reverse()){const entry=(session.exercises||[]).find(x=>x.name.toLowerCase()===ex.toLowerCase());if(entry)return entry.sets.map(s=>sportSetText(entry,s)).join(" · ");}return "Première séance";}
      function sportProgramCard(p, manage = false) {

      function exerciseProgress() {
        const exercises = new Map();

            const key = sportNormalizeName(exercise.name);

        }
        const best = new Map();
        for (const set of sets.filter(set => set.kg === Number(load.value))) {
          if (set.reps > (best.get(set.id)?.reps || 0)) best.set(set.id, set);

        const points = [...best.values()].sort((a, b) => a.date.localeCompare(b.date)).slice(-12);
        if (!points.length) return;
        const max = Math.max(...points.map(point => point.reps));

      function sportCreateProgram() {

      function sportEditProgram(p) {
        if (!p || p.id === SPORT_LOCKED_ID) return;
        let repeat = true;
        while (repeat) {
          const msg = `${p.name}\n\n${p.exercises.map((x, i) => `${i + 1}. ${x.name} — ${x.sets.length} séries (${x.sets[0]?.reps || 8} répétitions)`).join("\n") || "Aucun exercice"}\n\n1 = Ajouter un exercice\n2 = Retirer un exercice\n3 = Renommer le programme\n4 = Modifier les séries / répétitions d’un exercice\n0 = Terminer`;
          const cmd = prompt(msg, "1");
          if (cmd === null || cmd === "0") {
            repeat = false;
            break;
          }
          if (cmd === "1") {
            const name = prompt(
              "Nom de l’exercice (tu peux aussi choisir dans ta bibliothèque)\n" +
                sport.library.join(" · "),
            );
            if (!name?.trim()) continue;
            const n = Math.max(
              1,
              Math.min(12, Number(prompt("Nombre de séries ?", "3")) || 3),
            );
            const reps = Math.max(
              1,
              Number(prompt("Répétitions prévues ?", "8")) || 8,
            );
            const kg = Math.max(
              0,
              Number(prompt("Charge prévue (kg) ?", "0")) || 0,
            );
            p.exercises.push({
              name: name.trim(),
              sets: Array.from({ length: n }, () => ({
                kg,
                reps,
                done: false,
              })),
            });
            if (
              !sport.library.some(
                (x) => x.toLowerCase() === name.trim().toLowerCase(),
              )
            )
              sport.library.push(name.trim());
          } else if (cmd === "2") {
            const i = Number(prompt("Numéro de l’exercice à retirer ?")) - 1;
            if (
              p.exercises[i] &&
              confirm("Retirer cet exercice du programme ?")
            )
              p.exercises.splice(i, 1);
          } else if (cmd === "3") {
            const n = prompt("Nouveau nom", p.name);
            if (n?.trim()) p.name = n.trim();
          } else if (cmd === "4") {
            const i = Number(prompt("Numéro de l’exercice à modifier ?")) - 1,
              ex = p.exercises[i];
            if (ex) {
              const n = Math.max(
                1,
                Math.min(
                  12,
                  Number(prompt("Nombre de séries", String(ex.sets.length))) ||
                    ex.sets.length,
                ),
              );
              const r = Math.max(
                1,
                Number(
                  prompt("Répétitions prévues", String(ex.sets[0]?.reps || 8)),
                ) || 8,
              );
              const k = Math.max(
                0,
                Number(prompt("Charge prévue", String(ex.sets[0]?.kg || 0))) ||
                  0,
              );
              ex.sets = Array.from({ length: n }, () => ({
                kg: k,
                reps: r,
                done: false,
              }));
            }
          }
        }
        sportSave();
      }

      function sportFinish() {
        const a = sport.active;
        if (!a) return;
        if (!a.exercises.length) {
          alert("Ajoute au moins un exercice.");
          return;
        }
        if (!confirm("Terminer et enregistrer cette séance ?")) return;
        const last = sport.sessions.filter(
          (s) => s.type === "Musculation" && s.id !== a.editSessionId,
        );
        let pr = 0;
        for (const ex of a.exercises) {
          const max = Math.max(
            0,
            ...ex.sets.filter((x) => x.done).map((x) => Number(x.kg) || 0),
          );
          const prev = Math.max(
            0,
            ...last.flatMap((s) =>
              (s.exercises || [])
                .filter((x) => x.name === ex.name)
                .flatMap((x) =>
                  x.sets.filter((y) => y.done).map((y) => Number(y.kg) || 0),
                ),
            ),
          );
          if (max > prev && prev > 0) pr++;
        }
        a.pr = Math.min(pr, 3);
        if (a.editSessionId) {
          sport.sessions = sport.sessions.filter(
            (s) => s.id !== a.editSessionId,
          );
          delete a.editSessionId;

        sport.sessions.push(a);

function builder(program){if(program?.id===SPORT_LOCKED_ID)return;draft=program?JSON.parse(JSON.stringify(program)):{id:sportId(),name:'',exercises:[]};ctx=null;view='builder';open();renderBuilder();}
function renderBuilder(){
 const fields=(ex,i)=>{const kind=sportExerciseKind(ex);const input=(key,label,value,min=0,max="",step="1")=>`<label>${label}<input data-draft-field="${key}" data-index="${i}" type="number" min="${min}" ${max?'max="'+max+'"':''} step="${step}" value="${value}"></label>`;return input("count",kind==="cardio"?"Blocs":"Séries",ex.sets.length,1,12)+(kind==="cardio"?input("minutes","Durée (min)",ex.sets[0]?.minutes||0,0,"","0.5")+input("distance","Distance (km)",ex.sets[0]?.distance||0,0,"","0.1")+input("resistance","Résistance",ex.sets[0]?.resistance||0,0,"","0.5"):input("reps","Répétitions",ex.sets[0]?.reps||8,1)+(kind==="bodyweight"?'':input("kg","Charge (kg)",ex.sets[0]?.kg||0,0,"","0.5")));};
 shell('Mon programme','<label class="ex-field">Nom du programme<input data-program-name maxlength="80" value="'+text(draft.name)+'" placeholder="Ex. Haut du corps"></label><div class="program-draft-list">'+draft.exercises.map((ex,i)=>'<article class="program-draft-ex"><div><strong>'+text(ex.name)+'</strong><button type="button" data-draft-remove="'+i+'" aria-label="Retirer '+text(ex.name)+'">Retirer</button></div><small>'+({strength:'Charge et répétitions',bodyweight:'Poids du corps',cardio:'Cardio'})[sportExerciseKind(ex)]+'</small><div class="program-set-fields">'+fields(ex,i)+'</div></article>').join('')+'</div><p class="ex-help">Ces valeurs définissent le programme. Tu peux ajuster chaque série ou bloc pendant la séance.</p><button type="button" data-draft-add>+ Choisir un exercice</button><footer><button type="button" data-draft-cancel>Annuler</button><button type="button" data-draft-once>Faire cette séance uniquement</button><button type="button" class="primary" data-draft-save>Enregistrer le programme</button></footer>');
 layer.querySelector('[data-program-name]').oninput=e=>draft.name=e.target.value;
 layer.querySelectorAll('[data-draft-remove]').forEach(b=>b.onclick=()=>{draft.exercises.splice(Number(b.dataset.draftRemove),1);renderBuilder();});
 layer.querySelectorAll('[data-draft-field]').forEach(input=>input.onchange=()=>{const ex=draft.exercises[Number(input.dataset.index)],key=input.dataset.draftField,n=Number(input.value);const min=['reps','count'].includes(key)?1:0;if(!Number.isFinite(n)||n<min||(key==='count'&&(!Number.isInteger(n)||n>12))){error('Indique une valeur valide (1 à 12 séries ou blocs).');input.value=key==='count'?ex.sets.length:ex.sets[0][key]||0;return;}if(key==='count'){const ref=ex.sets.at(-1)||{kg:0,reps:8,done:false};ex.sets=Array.from({length:n},(_,i)=>ex.sets[i]||{...ref,done:false});}else ex.sets=ex.sets.map(s=>({...s,[key]:n}));});
 layer.querySelector('[data-draft-add]').onclick=()=>picker('program');layer.querySelector('[data-draft-cancel]').onclick=close;
 layer.querySelector('[data-draft-once]').onclick=()=>{if(!draft.exercises.length){error('Choisis au moins un exercice.');return;}if(sport.active&&!confirm('Remplacer la séance en cours ? Les modifications non terminées seront perdues.'))return;const session={id:sportId(),name:draft.name.trim()||'Séance improvisée',type:'Musculation',date:sportChosenDate(),exercises:JSON.parse(JSON.stringify(draft.exercises))};session.exercises.forEach(ex=>ex.sets.forEach(set=>set.done=false));const next={...sport,active:session,library:session.exercises.reduce((xs,e)=>remember(xs,e.name),sport.library),exerciseTypes:session.exercises.reduce((types,e)=>({...types,[norm(e.name)]:sportExerciseKind(e)}),sport.exerciseTypes||{})};if(commit(next)){sportOpenExercise=null;close();sportPage='home';sportRender();}};
 layer.querySelector('[data-draft-save]').onclick=()=>{if(!draft.name.trim()||!draft.exercises.length){error('Donne un nom au programme et choisis au moins un exercice.');return;}const program={...draft,name:draft.name.trim()},exists=sport.programs.some(p=>p.id===program.id),next={...sport,programs:exists?sport.programs.map(p=>p.id===program.id?program:p):[...sport.programs,program],library:program.exercises.reduce((xs,e)=>remember(xs,e.name),sport.library),exerciseTypes:program.exercises.reduce((types,e)=>({...types,[norm(e.name)]:sportExerciseKind(e)}),sport.exerciseTypes||{})};if(commit(next)){close();sportPage='programs';sportRender();}};
 layer.querySelector('[data-program-name]').focus({preventScroll:true});}
function libraryPage(){if(sportPage!=='library')return;const root=document.getElementById('trainingRoot');const head=root.querySelector('.training-hero'),nav=root.querySelector('.training-nav');root.replaceChildren(...[head,nav].filter(Boolean));const section=document.createElement('section');section.className='sport-card exercise-library-page';section.innerHTML='<h2>Bibliothèque d’exercices</h2><p>'+BUILTIN.length+' exercices de référence · tes exercices personnalisés sont conservés.</p><label class="ex-field">Rechercher<input data-library-search type="search" value="'+text(pageQuery)+'" placeholder="Nom, muscle ou nom anglais…"></label><label class="ex-field">Groupe musculaire<select data-library-group>'+selectHTML(pageGroup)+'</select></label><div class="sport-actions"><button data-library-custom>+ Ajouter un exercice personnalisé</button></div><p data-library-count aria-live="polite"></p><div data-library-results></div><p data-library-status role="status"></p>';root.append(section);section.querySelector('[data-library-search]').oninput=e=>{pageQuery=e.target.value;pageResults();};section.querySelector('[data-library-group]').onchange=e=>{pageGroup=e.target.value;pageResults();};section.querySelector('[data-library-custom]').onclick=()=>picker('library');pageResults();}
function pageResults(){const box=document.querySelector('[data-library-results]');if(!box)return;const list=matches(catalog(),pageQuery,pageGroup);document.querySelector('[data-library-count]').textContent=list.length+' exercices';box.innerHTML=list.map((e,i)=>'<article><div><strong>'+text(e.name)+'</strong><small>'+text(e.group)+'</small></div>'+(!e.builtin&&sport.library.includes(e.name)?'<button type="button" data-library-remove="'+i+'">Supprimer</button>':'')+'</article>').join('')||'<p>Aucun résultat.</p>';box.querySelectorAll('[data-library-remove]').forEach(b=>b.onclick=()=>{const name=list[Number(b.dataset.libraryRemove)].name;if(confirm('Retirer « '+name+' » de la bibliothèque ? Tes séances passées et tes programmes sont conservés.'))commit({...sport,library:sport.library.filter(n=>norm(n)!==norm(name))});});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-sport]');if(!b)return;const op=b.dataset.sport;if(!['addActiveEx','addLibrary','newProgram','edit','renameActive'].includes(op))return;e.preventDefault();e.stopImmediatePropagation();if(op==='addActiveEx'&&sport.active)picker('session',sport.active.id);else if(op==='addLibrary')picker('library');else if(op==='newProgram')builder();else if(op==='edit')builder(sport.programs.find(p=>p.id===b.dataset.id));},true);
document.addEventListener('click',e=>{if(!e.target.closest('[data-start-improvised]'))return;if(sport.active&&!confirm('Remplacer la séance en cours ?'))return;const next={...sport,active:{id:sportId(),name:'Séance improvisée',type:'Musculation',date:sportChosenDate(),exercises:[]}};if(commit(next)){sportOpenExercise=null;sportPage='home';sportRender();}},true);
// Other existing entry points share the same editor.
sportCreateProgram=()=>builder();sportEditProgram=p=>builder(p);
const previous=sportRender;sportRender=function(...args){const result=previous(...args);libraryPage();
if(sport.active&&sportPage==="home")document.querySelectorAll("#trainingRoot .sport-ex").forEach((node,i)=>{if(sportExerciseKind(sport.active.exercises[i])!=="cardio")return;const add=node.querySelector('[data-sport="addSet"]');if(add)add.textContent="+ Ajouter un bloc";});
return result;};
window.rpgExerciseLibrary={catalog:()=>catalog().map(e=>({...e})),normalize:norm,builtinCount:BUILTIN.length};libraryPage();
})();

</script>
</body>
